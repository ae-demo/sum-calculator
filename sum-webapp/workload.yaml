apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: sum-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: sum-calculator-sum-api
      name: http
      visibility: project
      envBindings:
        address: SUM_API_URL
  resources:
    - ref: sum-calculator-user-auth
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
